name: CI

# Checks every pull request and every branch push except main (main is built by deploy.yml).
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Bundles the Worker without uploading it, so a broken worker/ fails here and not at deploy time.
      - name: Check the Worker bundles
        run: npx wrangler deploy --dry-run --outdir /tmp/wr
