name: Build and deploy joinoasa.org

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'   # nightly rebuild (tech tree, projects)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false   # never cut a deploy off half way

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run check:launch   # informational: lists owner values still open

      # Uploads ./dist to Cloudflare (Workers static assets). Uses the wrangler version pinned in package.json.
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
