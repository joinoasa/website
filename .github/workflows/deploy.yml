name: Build and deploy joinoasa.org

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'   # nightly rebuild: the tech tree picks up node status (claims) from GitHub issues, plus the projects list
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: deploy
  cancel-in-progress: false   # never cut a deploy off half way

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}   # raises the API rate limit for the tech tree status pull (public data)
      - run: npm run check:launch   # informational: lists owner values still open

      # Brings the D1 schema up to date (migrations/) before the new Worker code goes live.
      # Only adds what is missing, so it is safe on every run. Non-interactive in CI.
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Uploads ./dist to Cloudflare (Workers static assets). Uses the wrangler version pinned in package.json.
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
